<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Optimized Gold Gradient for SVG -->
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5A059;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4B475;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A68341;stop-opacity:1" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0A0A0A" />
  
  <!-- "D" Logo Element - Stylized for Matrimonial Elegance -->
  <g transform="translate(128, 128)" filter="url(#subtle-glow)">
    <!-- Main Swash/Curve -->
    <path d="M64 48C48 48 32 64 32 96V352C32 384 48 400 64 400H160C266 400 352 314 352 208V192C352 86 266 0 160 0H64V48Z" fill="url(#gold-gradient)" transform="scale(0.6) translate(50, 80)" />
    
    <!-- Decorative Accents suggesting a bloom or knot -->
    <circle cx="128" cy="128" r="12" fill="#D4B475" />
    <path d="M128 40V80M128 176V216M40 128H80M176 128H216" stroke="#D4B475" stroke-width="8" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
