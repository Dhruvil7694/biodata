<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Translation Data</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        pre {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }

        .section {
            margin-bottom: 30px;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 5px;
        }

        h2 {
            color: #4ade80;
        }

        h3 {
            color: #fbbf24;
        }
    </style>
</head>

<body>
    <h1>Translation Debug Tool</h1>
    <div id="output">Loading...</div>

    <script>
        // Get Supabase config from environment
        const SUPABASE_URL = 'https://oqnxfqkqvhvdqcxqfzlk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xbnhmcWtxdmh2ZHFjeHFmemxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc5NzM1MzYsImV4cCI6MjA1MzU0OTUzNn0.Jq3Gg0QDMW8Wd9HqOEBVYjBLzLZWGpkBPPTCvgJTnhE';

        const { createClient } = supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function debugSections() {
            const { data, error } = await client
                .from('sections')
                .select('*')
                .order('order_index');

            if (error) {
                document.getElementById('output').innerHTML = `<pre>Error: ${JSON.stringify(error, null, 2)}</pre>`;
                return;
            }

            let html = '';
            data.forEach((section, idx) => {
                html += `
                    <div class="section">
                        <h2>Section ${idx + 1}: ${section.type}</h2>
                        <h3>Title EN:</h3>
                        <pre>${section.title_en || 'null'}</pre>
                        <h3>Title GU:</h3>
                        <pre>${section.title_gu || 'null'}</pre>
                        <h3>Content EN (Raw):</h3>
                        <pre>${section.content_en || 'null'}</pre>
                        <h3>Content GU (Raw):</h3>
                        <pre>${section.content_gu || 'null'}</pre>
                        <h3>Content EN (Parsed):</h3>
                        <pre>${formatJSON(section.content_en)}</pre>
                        <h3>Content GU (Parsed):</h3>
                        <pre>${formatJSON(section.content_gu)}</pre>
                    </div>
                `;
            });

            document.getElementById('output').innerHTML = html;
        }

        function formatJSON(str) {
            if (!str) return 'null';
            try {
                const parsed = JSON.parse(str);
                return JSON.stringify(parsed, null, 2);
            } catch (e) {
                return `Not JSON: ${str}`;
            }
        }

        debugSections();
    </script>
</body>

</html>
