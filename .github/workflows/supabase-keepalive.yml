name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity.
# This runs a tiny read query through the REST API twice a day.
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi
          curl -sS --fail --retry 3 --retry-delay 10 \
            "https://ektofyrvnqoxojomnong.supabase.co/rest/v1/site_settings?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling this workflow on every run resets that clock.
      - name: Re-enable this workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
